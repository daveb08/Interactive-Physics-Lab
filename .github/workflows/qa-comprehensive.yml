name: Comprehensive and visual QA
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprehensive:
    # Reference images were captured on Windows. Never generate baselines in CI.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-comprehensive-windows
          path: qa-results/
          retention-days: 14
