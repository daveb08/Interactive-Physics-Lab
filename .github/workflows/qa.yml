name: Automated QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run qa:fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-fast
          path: qa-results/
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:browser -- --project=desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-desktop
          path: qa-results/
          retention-days: 14
